<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smokeshed</title>
<meta name="description" content="Is it burning near you right now, and is that normal? A harmonized NASA MODIS + VIIRS fire record for anywhere on Earth, 2001 to now, plus the smokeshed behind Singapore's haze.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* ---------- colour tokens (light, then dark) ---------- */
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --line: #e6e5e0;
    --accent: #c2410c; --zero: #efeee9; --tip-bg: #0b0b0b; --tip-ink: #f9f9f7;
    /* status colours: reserved for status, always shown with an icon + a word */
    --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --wind: #3d4a5c;
    /* ColorBrewer "Oranges": one hue, light -> dark, colour-blind safe */
    --b1: #fee6ce; --b2: #fdd0a2; --b3: #fdae6b; --b4: #fd8d3c;
    --b5: #f16913; --b6: #d94801; --b7: #a63603; --b8: #7f2704;
    /* "Compared with normal": ColorBrewer RdBu, blue = quieter, grey = normal, red = busier */
    --dm3: #2166ac; --dm2: #67a9cf; --dm1: #d1e5f0; --d0: #e4e3de; --d1: #fddbc7; --d2: #ef8a62; --d3: #b2182b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --line: #383835;
      --accent: #fb923c; --zero: #262624; --tip-bg: #f0efec; --tip-ink: #0d0d0d; --wind: #c9d4e3;
      --b1: #4a1d06; --b2: #6b2a07; --b3: #8f3a08; --b4: #b84c0b;
      --b5: #e0640f; --b6: #f5842e; --b7: #fbab6b; --b8: #fdd3a8;
      --dm3: #5aa3e8; --dm2: #2f6ea3; --dm1: #253f57; --d0: #383835; --d1: #5c3027; --d2: #b4513a; --d3: #f2735f;
    }
  }
  :root[data-theme="dark"] {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --line: #383835;
    --accent: #fb923c; --zero: #262624; --tip-bg: #f0efec; --tip-ink: #0d0d0d; --wind: #c9d4e3;
    --b1: #4a1d06; --b2: #6b2a07; --b3: #8f3a08; --b4: #b84c0b;
    --b5: #e0640f; --b6: #f5842e; --b7: #fbab6b; --b8: #fdd3a8;
    --dm3: #5aa3e8; --dm2: #2f6ea3; --dm1: #253f57; --d0: #383835; --d1: #5c3027; --d2: #b4513a; --d3: #f2735f;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: relative; padding: 12px 60px 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  #tour-help { position: absolute; right: 16px; top: 14px; width: 34px; height: 34px; padding: 0; border-radius: 50%;
               font-weight: 700; font-size: 16px; }
  .help { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
  .help b { color: var(--ink); font-weight: 600; }
  h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  .tag { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }

  main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); min-height: calc(100vh - 62px); }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } #where { border-right: 0; } #map { flex: none; height: 380px; min-height: 0; } }

  /* ---------- left: where? ---------- */
  #where { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; border-right: 1px solid var(--line); }
  #search { display: flex; gap: 6px; }
  #search input { flex: 1; min-width: 0; padding: 8px 10px; font: inherit; color: var(--ink);
                  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line);
           background: var(--surface); color: var(--ink); padding: 7px 12px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); }
  .chips button { padding: 3px 10px; font-size: 13px; border-radius: 999px; }
  #map { flex: 1; min-height: 420px; border-radius: 8px; border: 1px solid var(--line); }
  /* Wide screens: the map column is exactly one screen tall and stays put while the
     answer scrolls. (Before, it stretched to the answer's full height, and Leaflet
     left the part below its first size blank.) */
  @media (min-width: 861px) {
    main { align-items: start; }
    #where { position: sticky; top: 0; height: calc(100vh - 64px); }
    #map { min-height: 0; }
  }

  /* map controls (basemap switch, legend) */
  .map-box { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
             box-shadow: 0 1px 4px rgba(0,0,0,.15); font-size: 12px; }
  .basemap { display: flex; overflow: hidden; }
  .basemap button { border: 0; border-radius: 0; padding: 6px 10px; font-size: 12px; background: transparent; }
  .basemap button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .map-legend { padding: 6px 9px; line-height: 1.6; }
  .map-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #f16913;
                     border: 1px solid #fff; vertical-align: -1px; margin-right: 5px; }
  .map-legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin: 0 3px 0 0; }
  .map-legend .line { display: inline-block; width: 14px; height: 3px; background: #c2410c; vertical-align: 3px; margin-right: 4px; }
  .map-legend .rect { display: inline-block; width: 12px; height: 9px; border: 2px dashed #c2410c; vertical-align: -1px; margin-right: 4px; }
  .box-label { background: var(--surface); color: var(--ink); border: 1px solid var(--line); font-size: 12px; font-weight: 600; box-shadow: none; }
  .path-label { background: #c2410c; color: #fff; border: 0; font-size: 12px; font-weight: 600; box-shadow: none; }
  .path-label::before, .box-label::before { display: none; }
  .pin-label { background: var(--ink); color: var(--surface); border: 0; font-weight: 600; box-shadow: none; }
  .pin-label::before { border-top-color: var(--ink) !important; }
  .leaflet-container { background: var(--zero); font: inherit; }

  /* ---------- right: the answer ---------- */
  #answer { padding: 14px 16px 24px; overflow: auto; }
  .eyebrow { margin: 0; font-size: 13px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
  .status { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; font-size: 13px; color: var(--ink-2); }
  .status .icon { width: 22px; height: 22px; border-radius: 6px; display: inline-grid; place-items: center;
                  color: #fff; font-weight: 800; font-size: 13px; }
  .status b { font-size: 17px; color: var(--ink); }
  .sentence { margin: 2px 0 8px; font-size: 21px; line-height: 1.3; font-weight: 600; }
  .sub { margin: 0 0 8px; color: var(--ink-2); }
  .sub strong { color: var(--ink); }
  .callout { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
  .callout p { margin: 0 0 6px; } .callout p:last-child { margin: 0; }

  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; align-items: end; height: 54px; max-width: 320px; margin: 6px 0 2px; }
  .week div { background: var(--b5); border-radius: 3px 3px 0 0; min-height: 2px; }
  .week-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 320px; font-size: 11px; color: var(--ink-2); text-align: center; }

  h2 { font-size: 15px; margin: 22px 0 4px; padding-top: 14px; border-top: 1px solid var(--line); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 10px 0 8px; font-size: 13px; color: var(--ink-2); }
  .controls select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg label { padding: 3px 8px; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; }
  .seg input:checked + span { color: var(--accent); font-weight: 600; }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); }
  #csv { margin-left: auto; }

  /* ---------- calendar heatmap ---------- */
  #calendar { display: grid; grid-template-columns: 38px repeat(12, minmax(14px, 1fr)); gap: 2px; font-size: 11px; color: var(--ink-2); }
  #calendar .mh { text-align: center; }
  #calendar .yr { text-align: right; padding-right: 4px; line-height: 16px; }
  #calendar .c { height: 16px; border-radius: 3px; background: var(--zero); }
  .nodata { background: repeating-linear-gradient(45deg, transparent 0 3px, var(--line) 3px 5px) !important; }
  #calendar .c.latest { outline: 2px solid var(--ink); outline-offset: -1px; }
  #calendar .c.event { outline: 3px solid var(--accent); outline-offset: -1px; }
  #calendar .c.season { box-shadow: inset 0 -3px 0 var(--ink); }   /* fire-season months in the "Usual" row */
  #calendar .yr.usual { font-weight: 700; color: var(--ink); }
  #calendar .gap-row { grid-column: 1 / -1; height: 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .dm3 { background: var(--dm3) !important; } .dm2 { background: var(--dm2) !important; } .dm1 { background: var(--dm1) !important; }
  .d0 { background: var(--d0) !important; } .d1 { background: var(--d1) !important; }
  .d2 { background: var(--d2) !important; } .d3 { background: var(--d3) !important; }
  h3.minor { font-size: 14px; margin: 20px 0 6px; }
  .years { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; align-items: end; height: 70px; }
  .years div { background: var(--b5); border-radius: 2px 2px 0 0; min-height: 2px; }
  .years div.partial { background: repeating-linear-gradient(45deg, var(--b3) 0 3px, var(--b5) 3px 6px); }
  .years-axis { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; font-size: 11px; color: var(--ink-2); }
  .years-axis span { white-space: nowrap; overflow: visible; }
  .event-box { border-left: 4px solid var(--accent); }
  #calendar .switch { grid-column: 1 / -1; font-size: 11px; color: var(--ink-2); border-top: 1px dashed var(--ink-2); padding: 1px 0 2px 42px; margin: 2px 0; }
  .b1 { background: var(--b1) !important; } .b2 { background: var(--b2) !important; }
  .b3 { background: var(--b3) !important; } .b4 { background: var(--b4) !important; }
  .b5 { background: var(--b5) !important; } .b6 { background: var(--b6) !important; }
  .b7 { background: var(--b7) !important; } .b8 { background: var(--b8) !important; }
  #legend { display: flex; align-items: center; gap: 2px; margin: 10px 0 0 40px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
  #legend i { display: inline-block; width: 18px; height: 12px; border-radius: 2px; }
  #legend .gap { width: 10px; }

  details { margin-top: 18px; font-size: 13px; color: var(--ink-2); }
  details summary { cursor: pointer; color: var(--ink); font-weight: 600; }
  details li { margin: 4px 0; }
  a { color: var(--accent); }

  #tooltip { position: fixed; pointer-events: none; z-index: 1000; background: var(--tip-bg); color: var(--tip-ink);
             font-size: 12px; padding: 6px 8px; border-radius: 6px; max-width: 240px; }
</style>
</head>
<body>
<header>
  <h1>Smoke<span>shed</span></h1>
  <p class="tag">A harmonized burning calendar for anywhere on Earth: NASA's MODIS and VIIRS fire satellites as one record, 2001 to today, with an early warning for right now.</p>
  <button type="button" id="tour-help" aria-label="Take the guided tour" title="Take the guided tour">?</button>
</header>

<main>
  <section id="where" aria-label="Choose a place">
    <div data-tour="place">
    <form id="search">
      <input id="q" type="search" placeholder="Search a city, or type lat, lon" aria-label="City or latitude, longitude">
      <button class="primary" type="submit">Show</button>
    </form>
    <div class="chips" style="margin-top:8px">Try:
      <button type="button" data-lat="1.352" data-lon="103.82" data-name="Singapore">Singapore</button>
      <button type="button" data-lat="18.79" data-lon="98.98" data-name="Chiang Mai">Chiang Mai</button>
      <button type="button" data-lat="34.05" data-lon="-118.24" data-name="Los Angeles">Los Angeles</button>
      <button type="button" data-lat="-3.12" data-lon="-60.02" data-name="Manaus">Manaus</button>
      <button type="button" data-lat="-33.87" data-lon="151.21" data-name="Sydney">Sydney</button>
    </div>
    <div class="chips" id="famous" style="margin-top:6px">Famous fires:</div>
    </div>
    <div id="map" data-tour="map" role="application" aria-label="Map: click anywhere to check it"></div>
  </section>

  <section id="answer" aria-live="polite">
    <p class="eyebrow" id="place">Loading…</p>
    <div class="callout event-box" id="event" hidden></div>

    <!-- 1. Right now -->
    <div data-tour="status">
      <div class="status" id="status"></div>
      <p class="sentence" id="now-sentence"></p>
      <div class="week" id="week" aria-hidden="true"></div>
      <div class="week-days" id="week-days" aria-hidden="true"></div>
      <p class="help" id="help-now"></p>
      <p class="sub" id="coming" style="margin-top:8px"></p>
    </div>
    <div class="callout" id="singapore" data-tour="singapore" hidden>
      <p id="warn"></p>
      <p id="air"></p>
    </div>

    <!-- 2. History -->
    <h2 id="cal-title">Burning calendar, 2001 to now</h2>
    <p class="sub" id="history"></p>
    <div class="controls">
      <span id="size-wrap">Area:
        <span class="seg" role="radiogroup" aria-label="Area size">
          <label><input type="radio" name="size" value="1"><span>~110 km</span></label>
          <label><input type="radio" name="size" value="3" checked><span>~330 km</span></label>
          <label><input type="radio" name="size" value="5"><span>~550 km</span></label>
        </span>
      </span>
      <span>Years: <select id="from" aria-label="From year"></select> to <select id="to" aria-label="To year"></select></span>
      <span>Colour:
        <span class="seg" role="radiogroup" aria-label="Calendar colours">
          <label><input type="radio" name="view" value="count" checked><span>Fire count</span></label>
          <label><input type="radio" name="view" value="anom"><span>Compared with normal</span></label>
        </span>
      </span>
      <button id="csv" type="button" data-tour="csv">Download CSV</button>
    </div>
    <div data-tour="calendar">
      <p class="help" id="cal-help" style="margin:0 0 4px"></p>
      <p class="help" id="cal-note" style="margin:0 0 8px"></p>
      <div id="calendar"></div>
      <div id="legend"></div>
    </div>

    <h3 class="minor">Fires per year</h3>
    <div class="years" id="years"></div>
    <div class="years-axis" id="years-axis" aria-hidden="true"></div>
    <p class="help" id="trend"></p>

    <details id="method-box">
      <summary>How the numbers are made</summary>
      <ul id="method"></ul>
    </details>
  </section>
</main>
<div id="tooltip" role="tooltip" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* Smokeshed front end: plain JavaScript, no build step.
   Pre-computed data (see pipeline/):
     data/processed/now.json                 fires per 1-degree cell, last 7 days (updated daily by a GitHub Action)
     data/processed/calendar/meta.json       months, harmonization ratios
     data/processed/calendar/tile_*.json     monthly fires per 1-degree cell, 2001 to now
     data/processed/smokeshed.json           Singapore's smokeshed + feasibility result
   Live, straight from the browser (free, no key):
     NASA GIBS satellite image, data.gov.sg PM2.5 for Singapore. */

const DATA = "data/processed/";
const FIRST_YEAR = 2001;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const fmt = n => Math.round(n).toLocaleString("en-US");
const dayLabel = iso => { const d = new Date(iso + "T00:00:00Z"); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; };
const daysInMonth = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();   // m is 0-11

const state = { lat: 1.352, lon: 103.82, name: "Singapore", size: 3, from: FIRST_YEAR, to: null,
                view: "count",   // calendar colours: "count" or "anom" (compared with normal)
                event: null };   // index into EVENTS when a famous fire was clicked

// Famous fires: one click shows the place, a short summary, and outlines the months.
// Each location was checked: the event is the #1 month on record in its ~330 km area.
const EVENTS = [
  { name: "Indonesia haze 2015", place: "South Sumatra", lat: -3.0, lon: 105.0, months: ["2015-09", "2015-10"],
    text: "During the 2015 El Niño drought, peatland fires burned across Sumatra and Kalimantan for months and blanketed Southeast Asia in haze." },
  { name: "Australia's Black Summer", place: "New South Wales south coast", lat: -35.7, lon: 150.18, months: ["2019-12", "2020-01"],
    text: "Australia's 2019–20 \"Black Summer\" bushfires burned across the southeast for months; New South Wales and Victoria were hit hardest." },
  { name: "Pantanal 2020", place: "Corumbá, Brazil", lat: -18.0, lon: -57.0, months: ["2020-08", "2020-09"],
    text: "During a severe drought in 2020, fires swept through an unusually large part of the Pantanal, the world's largest tropical wetland." },
  { name: "California 2020", place: "Northern California", lat: 39.8, lon: -122.8, months: ["2020-08", "2020-09"],
    text: "Lightning in August 2020 started the August Complex, which grew into California's largest recorded wildfire." },
  { name: "Canada 2023", place: "Quebec", lat: 49.05, lon: -76.98, months: ["2023-06"],
    text: "Canada's 2023 fire season was its worst on record; in June, fires in Quebec sent thick smoke as far as New York City." },
];
let meta, smokeshed, now, map, overlay, series = [], lastFull = 0, lastYear = 0;

// ---------- data loading ----------

const tileCache = new Map();
function loadTile(id) {
  if (!tileCache.has(id)) {
    // A missing tile means "no fires ever detected there": zero is data, not an error.
    tileCache.set(id, fetch(`${DATA}calendar/tile_${id}.json`)
      .then(r => (r.ok ? r.json() : { cells: {} }))
      .catch(() => ({ cells: {} })));
  }
  return tileCache.get(id);
}
const tileId = (lat, lon) => `${Math.floor(lat / 10) * 10}_${Math.floor(lon / 10) * 10}`;
const wrapLon = lon => ((((lon + 180) % 360) + 360) % 360) - 180;

// Singapore gets its smokeshed (where its smoke comes from), not a box around the pin.
const isSingapore = () => Math.floor(state.lat) === 1 && Math.floor(state.lon) === 103;

function boxCells([s, w, n, e]) {
  const cells = [];
  for (let la = s; la < n; la++) for (let lo = w; lo < e; lo++) cells.push([la, lo]);
  return cells;
}

function areaCells() {
  if (isSingapore()) return smokeshed.regions.flatMap(r => boxCells(r.box_swne));
  const half = (state.size - 1) / 2, la0 = Math.floor(state.lat), lo0 = Math.floor(state.lon);
  const cells = [];
  for (let dy = -half; dy <= half; dy++) for (let dx = -half; dx <= half; dx++) {
    const la = la0 + dy;
    if (la >= -90 && la < 90) cells.push([la, wrapLon(lo0 + dx)]);
  }
  return cells;
}

async function monthlySeries(cells) {
  const total = new Array(meta.n_months).fill(0);
  const tiles = await Promise.all(cells.map(([la, lo]) => loadTile(tileId(la, lo))));
  cells.forEach(([la, lo], i) => {
    const row = tiles[i].cells[`${la},${lo}`];
    if (row) row.forEach((n, m) => { total[m] += n; });
  });
  return total;
}

function weekSeries(cells) {  // fires per day, last 7 days
  const total = new Array(now.days.length).fill(0);
  for (const [la, lo] of cells) {
    const row = now.cells[`${la},${lo}`];
    if (row) row.forEach((n, d) => { total[d] += n; });
  }
  return total;
}

// ---------- "normal" = the median of the same month, 2001 to last year ----------

const median = xs => { const s = [...xs].sort((a, b) => a - b); const h = s.length >> 1;
  return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
const idxOf = (y, m) => (y - FIRST_YEAR) * 12 + m;
const usualMonth = (ser, m) => median(Array.from({ length: lastYear - FIRST_YEAR }, (_, k) => ser[idxOf(FIRST_YEAR + k, m)]));

// Normal number of fires over `days` days at this time of year.
function normalFor(ser, days) {
  const end = new Date(now.through + "T00:00:00Z");
  const m = end.getUTCMonth();
  return usualMonth(ser, m) * days / daysInMonth(end.getUTCFullYear(), m);
}

// ---------- 1. right now ----------

const STATUS = {
  quiet:   { label: "Quiet",        color: "var(--good)",     icon: "✓" },
  normal:  { label: "Normal",       color: "var(--good)",     icon: "✓" },
  above:   { label: "Above normal", color: "var(--warning)",  icon: "▲" },
  unusual: { label: "Unusual",      color: "var(--warning)",  icon: "▲" },
  surge:   { label: "Surge",        color: "var(--critical)", icon: "!" },
};

function judge(count, normal) {
  if (normal < 1) return count < 5 ? "quiet" : "unusual";
  const x = count / normal;
  if (x >= 3) return "surge";
  if (x >= 1.5) return "above";
  if (x <= 0.5) return "quiet";
  return "normal";
}

function nowSentence(count, normal, where) {
  const month = MONTHS_LONG[new Date(now.through + "T00:00:00Z").getUTCMonth()];
  const head = `${fmt(count)} fire hotspot${count === 1 ? "" : "s"} ${where} in the last 7 days`;
  if (normal < 1) return count === 0 ? `No fires ${where} in the last 7 days, which is normal for ${month}.`
                                     : `${head}. Usually there are almost none in ${month}.`;
  const x = count / normal;
  if (x >= 1.5) return `${head}: ${x.toFixed(1)}× normal for ${month}.`;
  if (x <= 0.67) return `${head}, below normal for ${month} (usually about ${fmt(normal)}).`;
  return `${head}, about normal for ${month} (usually about ${fmt(normal)}).`;
}

function drawWeek(week) {
  const max = Math.max(1, ...week);
  document.getElementById("week").innerHTML = week.map((n, d) =>
    `<div style="height:${Math.max(4, (n / max) * 100)}%" data-tip="${dayLabel(now.days[d])}: ${fmt(n)} fire hotspots"></div>`).join("");
  document.getElementById("week-days").innerHTML = now.days.map(d => `<span>${dayLabel(d).split(" ")[0]}</span>`).join("");
}

async function writeNow(cells) {
  const week = weekSeries(cells);
  const count = week.reduce((a, b) => a + b, 0);
  const normal = normalFor(series, 7);
  const st = STATUS[judge(count, normal)];
  const monthName = MONTHS_LONG[new Date(now.through + "T00:00:00Z").getUTCMonth()];
  document.getElementById("status").innerHTML =
    `<span class="icon" style="background:${st.color}" aria-hidden="true">${st.icon}</span>`
    + `<b>${st.label}</b><span>· last 7 days (${dayLabel(now.days[0])} to ${dayLabel(now.through)}) vs. a normal ${monthName} week</span>`;
  document.getElementById("help-now").innerHTML =
    `<b>Hotspot</b> = a spot where a NASA satellite detected an active fire. `
    + (isSingapore() ? `<b>Smokeshed</b> = the areas whose fire smoke reaches Singapore's air.`
                     : `"Normal" = the usual for ${monthName}, 2001 to last year.`);
  document.getElementById("now-sentence").textContent =
    nowSentence(count, normal, isSingapore() ? "in Singapore's smokeshed" : "in this area");
  drawWeek(week);

  const box = document.getElementById("singapore");
  box.hidden = !isSingapore();
  if (isSingapore()) { await writeSingaporeWarning(); writeSingaporeAir(); }
}

// Singapore: turn the measured "Sumatra fires -> worse air ~1 day later" link into a warning.
async function writeSingaporeWarning() {
  const lead = smokeshed.regions.find(r => r.name === smokeshed.lead_region);
  const cells = boxCells(lead.box_swne);
  const recent = weekSeries(cells).slice(-2).reduce((a, b) => a + b, 0);   // last 2 days
  const normal = normalFor(await monthlySeries(cells), 2);
  const x = normal >= 1 ? recent / normal : 0;
  // Is the wind blowing from the fires toward Singapore right now? Ask Open-Meteo;
  // if that fails, fall back to the season (Jun-Oct monsoon blows Sumatra -> Singapore).
  const [s, w, n, e] = lead.box_swne;
  const fireToCity = bearing((s + n) / 2, (w + e) / 2, state.lat, state.lon);
  let toward, windText = "", wind = null;
  try {
    [wind] = await getWind([[state.lat, state.lon]]);
    toward = angleDiff((wind.from + 180) % 360, fireToCity) <= 45;
    windText = `<strong>Wind at Singapore now:</strong> ${Math.round(wind.speed)} km/h from the ${compass(wind.from)}, `
      + (toward ? `blowing from ${lead.name} toward Singapore.` : `so smoke from ${lead.name} is not heading this way.`)
      + ` <span class="help">Wind data: <a href="https://open-meteo.com/">Open-Meteo</a>.</span>`;
  } catch {
    const month = new Date(now.through + "T00:00:00Z").getUTCMonth();
    toward = month >= 5 && month <= 9;
  }
  let text;
  if (x >= 1.5) {
    text = toward
      ? `<strong>Haze warning:</strong> fires in ${lead.name} are ${x.toFixed(1)}× normal over the last 2 days, and the wind is `
        + `blowing their smoke toward Singapore. In 2026, Singapore's air got worse about ${lead.lag_days} day after surges like this.`
      : `<strong>Watch:</strong> fires in ${lead.name} are ${x.toFixed(1)}× normal over the last 2 days, but the wind is carrying `
        + `the smoke away from Singapore for now. If the wind turns, haze could arrive within about ${lead.lag_days} day.`;
  } else {
    text = `<strong>No haze warning:</strong> fires in ${lead.name}, where Singapore's haze mostly comes from, `
      + `are ${x >= 0.67 ? "at normal levels" : "below normal"} over the last 2 days.`;
    // Explain a surge elsewhere in the smokeshed, so "Surge" above and "No warning" here don't clash.
    for (const other of smokeshed.regions.filter(r => r !== lead)) {
      const oc = boxCells(other.box_swne);
      const week = weekSeries(oc).reduce((a, b) => a + b, 0);
      const on = normalFor(await monthlySeries(oc), 7);
      if (on >= 1 && week / on >= 1.5) {
        const [os, ow, onn, oe] = other.box_swne;
        const otherToward = wind && angleDiff((wind.from + 180) % 360,
                                              bearing((os + onn) / 2, (ow + oe) / 2, state.lat, state.lon)) <= 45;
        text += ` This week's rise is in ${other.name} (${(week / on).toFixed(1)}× normal), whose smoke `
          + `reaches Singapore less directly (${other.r < 0.5 ? "weak" : "moderate"} link, ~${other.lag_days} days).`
          + (otherToward ? ` <strong>But today's wind is blowing from ${other.name} toward Singapore</strong>, so keep an eye on the air reading below.` : "");
      }
    }
  }
  document.getElementById("warn").innerHTML = text + (windText ? `<br>${windText}` : "");
}

// Singapore's live PM2.5, straight from data.gov.sg (free, allows browser requests).
async function writeSingaporeAir() {
  const el = document.getElementById("air");
  el.textContent = "Checking Singapore's air right now…";
  try {
    const r = await fetch("https://api-open.data.gov.sg/v2/real-time/api/pm25");
    const items = (await r.json()).data.items;
    const latest = items.reduce((a, b) => (a.timestamp > b.timestamp ? a : b));
    const vals = Object.values(latest.readings.pm25_one_hourly);
    const pm = vals.reduce((a, b) => a + b, 0) / vals.length;
    // NEA's 1-hour PM2.5 bands
    const band = pm <= 55 ? "Band I: Normal (0–55)" : pm <= 150 ? "Band II: Elevated (56–150)"
               : pm <= 250 ? "Band III: High (151–250)" : "Band IV: Very high (251+)";
    const time = latest.timestamp.slice(11, 16);
    el.innerHTML = `<strong>Singapore's air now:</strong> ${Math.round(pm)} µg/m³ of PM2.5 (fine smoke and dust particles) `
      + `at ${time}, ${band}. Source: NEA via data.gov.sg.`;
  } catch {
    el.textContent = "Singapore's live air reading is unavailable right now (data.gov.sg).";
  }
}

// ---------- 2. history ----------

function historySentence(where) {
  const y = FIRST_YEAR + Math.floor(lastFull / 12), m = lastFull % 12;
  const v = series[lastFull], med = usualMonth(series, m), when = `${MONTHS_LONG[m]} ${y}`;
  let s;
  if (med === 0 && v === 0) s = `No fires ${where} in ${when}, which is normal.`;
  else if (med === 0) s = `${when}: ${fmt(v)} fire hotspots ${where}; most ${MONTHS_LONG[m]}s have none.`;
  else {
    const x = v / med;
    s = x >= 1.5 ? `${when}: ${fmt(v)} fire hotspots ${where}, ${x.toFixed(1)}× the usual ${MONTHS_LONG[m]} (${fmt(med)}).`
      : x <= 0.67 ? `${when}: ${fmt(v)} fire hotspots ${where}, below the usual ${MONTHS_LONG[m]} (${fmt(med)}).`
      : `${when}: ${fmt(v)} fire hotspots ${where}, about the usual for ${MONTHS_LONG[m]} (${fmt(med)}).`;
  }
  let worst = 0;
  for (let i = 1; i < idxOf(lastYear, 0); i++) if (series[i] > series[worst]) worst = i;
  if (series[worst] === 0) return "No vegetation fires detected here by NASA satellites since 2001.";
  const season = fireSeason();
  const seasonTxt = !season.text ? "" : season.text === "all year" ? " Fires here happen all year round."
    : season.text.includes("–") || season.text.includes(" and ") ? ` Fire season here usually runs ${season.text}.`
    : ` Fire season here usually peaks in ${season.text}.`;
  return `${s}${seasonTxt} Worst month on record: ${MONTHS_LONG[worst % 12]} ${FIRST_YEAR + Math.floor(worst / 12)} (${fmt(series[worst])}).`;
}

// The critical period: months whose usual fire count is at least half of the busiest month's.
function fireSeason() {
  const meds = MONTHS.map((_, m) => usualMonth(series, m));
  const max = Math.max(...meds);
  const set = new Set(max > 0 ? meds.flatMap((v, m) => (v >= max / 2 ? [m] : [])) : []);
  // Fill one-month gaps (Aug + Oct -> Aug-Oct): a season doesn't pause for a month.
  for (let m = 0; m < 12; m++) if (set.has((m + 11) % 12) && set.has((m + 1) % 12)) set.add(m);
  if (!set.size) return { set, text: "" };
  if (set.size === 12) return { set, text: "all year" };
  const runs = [];
  for (let m = 0; m < 12; m++) {
    if (!set.has(m) || set.has((m + 11) % 12)) continue;  // only start at the first month of a run
    let end = m;
    while (set.has((end + 1) % 12)) end = (end + 1) % 12;
    runs.push(m === end ? MONTHS_LONG[m] : `${MONTHS_LONG[m]}–${MONTHS_LONG[end]}`);
  }
  return { set, text: runs.join(" and ") };
}

// "Coming up": is next month usually busier or quieter? Anticipating critical periods.
function comingUp() {
  const m = new Date(now.through + "T00:00:00Z").getUTCMonth(), n = (m + 1) % 12;
  const a = usualMonth(series, m), b = usualMonth(series, n);
  if (a === 0 && b === 0) return "";
  const season = fireSeason();
  const edge = season.set.has(n) && !season.set.has(m) ? ` That's the start of the usual fire season (${season.text}).`
             : !season.set.has(n) && season.set.has(m) ? ` The usual fire season (${season.text}) is ending.` : "";
  let s;
  if (a === 0) s = `${MONTHS_LONG[n]} usually brings about ${fmt(b)} fire hotspots here, up from almost none in ${MONTHS_LONG[m]}.`;
  else {
    const r = b / a;
    s = r >= 1.5 ? `${MONTHS_LONG[n]} is usually ${r.toFixed(1)}× busier than ${MONTHS_LONG[m]} here.`
      : r <= 0.67 ? `${MONTHS_LONG[n]} usually has about ${Math.round((1 - r) * 100)}% fewer fires than ${MONTHS_LONG[m]} here.`
      : `${MONTHS_LONG[n]} is usually similar to ${MONTHS_LONG[m]} here.`;
  }
  return `<strong>Coming up:</strong> ${s}${edge}`;
}

function binOf(v, max) {
  // 8 square-root bins: bad months stand out, but quiet months stay visible.
  if (v <= 0) return 0;
  return Math.max(1, Math.ceil(Math.sqrt(v / max) * 8));
}

// "Compared with normal": how far a month is from the usual for that month (-3 quieter ... +3 busier).
// `minDiff` = the smallest difference that matters here (10% of a usual fire-season month).
// Smaller differences stay grey: otherwise "30 fires instead of 10" in the off-season would
// shout as loudly as a fire season gone wrong.
function anomClass(v, med, minDiff) {
  let b;
  if (Math.abs(v - med) < minDiff) b = 0;
  else if (med === 0) b = 3;   // usually none, now a meaningful amount: very unusual
  else {
    const r = v / med;
    b = r <= 0.25 ? -3 : r <= 0.5 ? -2 : r < 0.8 ? -1 : r <= 1.25 ? 0 : r < 2 ? 1 : r < 4 ? 2 : 3;
  }
  return b < 0 ? `dm${-b}` : `d${b}`;
}

// The MODIS -> VIIRS conversion used for this area (one ratio per 10-degree region).
function areaRatioText(cells) {
  const rs = [...new Set(cells.map(([la, lo]) => tileId(la, lo)))].map(t => meta.tile_ratios[t] ?? meta.global_ratio);
  const lo = Math.round(Math.min(...rs)), hi = Math.round(Math.max(...rs));
  return lo === hi ? `${lo}` : `${lo}–${hi}`;
}

function drawCalendar() {
  const anom = state.view === "anom";
  const meds = MONTHS.map((_, m) => usualMonth(series, m));
  const season = fireSeason();
  const err = (meta.ratio_check.match(/within (\d+)%/) || [])[1] || "?";
  const ev = state.event === null ? null : EVENTS[state.event];
  const evIdx = new Set(ev ? ev.months.map(s => idxOf(+s.slice(0, 4), +s.slice(5) - 1)) : []);
  const shown = [];
  for (let y = state.from; y <= state.to; y++) for (let m = 0; m < 12; m++) {
    const i = idxOf(y, m); if (i < meta.n_months) shown.push(series[i]);
  }
  const max = Math.max(1, ...shown);
  const minDiff = Math.max(3, 0.1 * Math.max(...meds));

  const html = ['<div></div>', ...MONTHS.map(m => `<div class="mh">${m[0]}</div>`)];
  // A usual year (median of each month): the baseline "unusual" is measured against,
  // with the fire season underlined.
  html.push(`<div class="yr usual">Usual</div>`);
  meds.forEach((v, m) => {
    const t = `Usual ${MONTHS_LONG[m]}: ${fmt(v)} hotspots (median ${FIRST_YEAR}–${lastYear - 1})${season.set.has(m) ? " · fire season" : ""}`;
    html.push(`<div class="c b${binOf(v, max)}${season.set.has(m) ? " season" : ""}" data-tip="${t}" aria-label="${t}" role="img"></div>`);
  });
  html.push(`<div class="gap-row"></div>`);

  for (let y = state.to; y >= state.from; y--) {   // newest year on top
    if (y === meta.switch_year - 1 && state.to >= meta.switch_year) {
      html.push(`<div class="switch">↑ from ${meta.switch_year}: newer VIIRS satellite · ↓ before ${meta.switch_year}: older MODIS satellite, converted to match</div>`);
    }
    html.push(`<div class="yr">${y}</div>`);
    for (let m = 0; m < 12; m++) {
      const i = idxOf(y, m);
      if (i >= meta.n_months) { html.push(`<div class="c nodata" data-tip="${MONTHS_LONG[m]} ${y}: not yet"></div>`); continue; }
      const v = series[i], med = meds[m];
      const partial = i === meta.n_months - 1 && i !== lastFull;
      const amount = y < meta.switch_year ? `≈${fmt(v)} hotspots (±${err}%, converted from MODIS)` : `${fmt(v)} hotspots`;
      const cmp = med > 0 ? `, ${(v / med).toFixed(1)}× the usual ${MONTHS_LONG[m]}` : v > 0 ? `; usually none` : "";
      const t = `${MONTHS_LONG[m]} ${y}${partial ? " (month so far)" : ""}: ${amount}${partial ? "" : cmp}`;
      // A month that isn't over yet can't be compared with a full usual month.
      const colour = anom ? (partial ? "nodata" : anomClass(v, med, minDiff)) : `b${binOf(v, max)}`;
      const extra = (i === lastFull ? " latest" : "") + (evIdx.has(i) ? " event" : "");
      html.push(`<div class="c ${colour}${extra}" data-tip="${t}" aria-label="${t}" role="img"></div>`);
    }
  }
  document.getElementById("calendar").innerHTML = html.join("");

  document.getElementById("cal-help").innerHTML = anom
    ? `Each square is one month, compared with the usual for that month: <b>red = busier than usual, blue = quieter</b>. Small differences stay grey. Top row: a usual year (fire season underlined).`
    : `Each square is one month; <b>darker = more fires</b>. Top row: a usual year (fire season underlined). Hover a square for the numbers.`;
  document.getElementById("legend").innerHTML = anom
    ? `quieter&nbsp;<i class="dm3"></i><i class="dm2"></i><i class="dm1"></i>&nbsp;<i class="d0"></i>&nbsp;normal&nbsp;`
      + `<i class="d1"></i><i class="d2"></i><i class="d3"></i>&nbsp;busier than usual (darkest: 4× or more)`
      + `<span class="gap"></span><i class="nodata"></i>&nbsp;not yet / month not over`
    : `<i style="background:var(--zero)"></i>&nbsp;no fires<span class="gap"></span>fewer&nbsp;`
      + [1, 2, 3, 4, 5, 6, 7, 8].map(b => `<i class="b${b}"></i>`).join("")
      + `&nbsp;more fires per month (darkest: ${fmt(max)})<span class="gap"></span><i class="nodata"></i>&nbsp;not yet`;
}

// Fires per year, 2001 to now, plus a plain-language trend.
function drawYears() {
  const totals = [];
  for (let y = FIRST_YEAR; y <= lastYear; y++) {
    let t = 0;
    for (let m = 0; m < 12; m++) { const i = idxOf(y, m); if (i < meta.n_months) t += series[i]; }
    totals.push(t);
  }
  const max = Math.max(1, ...totals);
  document.getElementById("years").innerHTML = totals.map((t, k) => {
    const y = FIRST_YEAR + k, partial = y === lastYear;
    const label = `${y}${partial ? " so far" : ""}: ${y < meta.switch_year ? "≈" : ""}${fmt(t)} fire hotspots`;
    return `<div class="${partial ? "partial" : ""}" style="height:${Math.max(2, (t / max) * 100)}%" data-tip="${label}"></div>`;
  }).join("");
  document.getElementById("years-axis").innerHTML = totals.map((_, k) =>
    `<span>${(FIRST_YEAR + k) % 5 === 0 ? FIRST_YEAR + k : ""}</span>`).join("");

  // Compare the last 10 complete years with the first 10.
  const done = totals.slice(0, lastYear - FIRST_YEAR);
  const mean = xs => xs.reduce((a, b) => a + b, 0) / xs.length;
  const a = mean(done.slice(0, 10)), b = mean(done.slice(-10));
  const first = `${FIRST_YEAR}–${FIRST_YEAR + 9}`, last = `${lastYear - 10}–${lastYear - 1}`;
  let s = "";
  if (a > 0 || b > 0) {
    const ch = (b - a) / Math.max(a, 1);
    s = Math.abs(ch) < 0.15
      ? `Long-term: about the same. The last 10 years (${last}) are within 15% of the first 10 (${first}).`
      : ch >= 1
      ? `Long-term: the last 10 years (${last}) averaged ${(b / Math.max(a, 1)).toFixed(1)}× as many fires per year as the first 10 (${first}).`
      : `Long-term: the last 10 years (${last}) averaged ${Math.round(Math.abs(ch) * 100)}% ${ch < 0 ? "fewer" : "more"} fires per year than the first 10 (${first}).`;
  }
  document.getElementById("trend").textContent = s;
}

// The summary box for a famous fire, with what our own data says about it.
function writeEvent() {
  const box = document.getElementById("event");
  if (state.event === null) { box.hidden = true; return; }
  const ev = EVENTS[state.event];
  const idx = ev.months.map(s => idxOf(+s.slice(0, 4), +s.slice(5) - 1));
  const peak = idx.reduce((a, b) => (series[b] > series[a] ? b : a));
  const rank = series.filter(v => v > series[peak]).length + 1;
  const m = peak % 12, med = usualMonth(series, m);
  const when = `${MONTHS_LONG[m]} ${FIRST_YEAR + Math.floor(peak / 12)}`;
  box.innerHTML = `<p><strong>${ev.name}</strong> · ${ev.place}</p><p>${ev.text}</p>`
    + `<p class="help">In our calendar: ${when} is ${rank === 1 ? "the busiest month on record" : `#${rank} of all months on record`} in this area, `
    + `with ${fmt(series[peak])} fire hotspots${med > 0 ? `, ${Math.round(series[peak] / med)}× the usual ${MONTHS_LONG[m]}` : ""}. `
    + `Those months are outlined in orange in the calendar below.</p>`;
  box.hidden = false;
}

// Hover tooltips for the calendar, the 7-day bars and the yearly bars.
const tip = document.getElementById("tooltip");
for (const id of ["calendar", "week", "years"]) {
  const el = document.getElementById(id);
  el.addEventListener("mousemove", e => {
    const t = e.target.dataset && e.target.dataset.tip;
    if (!t) { tip.hidden = true; return; }

}

document.getElementById("csv").addEventListener("click", () => {
  const area = isSingapore() ? "Singapore smokeshed (Sumatra + Kalimantan boxes)"
                             : `${state.name} (${state.lat.toFixed(3)}, ${state.lon.toFixed(3)}), ${state.size}x${state.size} degree box`;

// ---------- wind (Open-Meteo: free, no key, allows browser requests) ----------

const COMPASS = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
const compass = deg => COMPASS[Math.round(deg / 45) % 8];
const angleDiff = (a, b) => Math.abs((((a - b) % 360) + 540) % 360 - 180);
// Compass bearing from point 1 to point 2 (flat-earth approximation is fine at this scale).
const bearing = (lat1, lon1, lat2, lon2) =>
  (Math.atan2((lon2 - lon1) * Math.cos(lat1 * Math.PI / 180), lat2 - lat1) * 180 / Math.PI + 360) % 360;

// Current wind at many points in one request: [[lat, lon], ...] -> [{ speed (km/h), from (degrees) }]
async function getWind(pts) {
  const lat = pts.map(p => p[0].toFixed(2)).join(","), lon = pts.map(p => p[1].toFixed(2)).join(",");
  const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
                        + `&current=wind_speed_10m,wind_direction_10m&wind_speed_unit=kmh`);
  if (!r.ok) throw new Error(`wind ${r.status}`);
  const d = await r.json();
  return (Array.isArray(d) ? d : [d]).map(x => ({ speed: x.current.wind_speed_10m, from: x.current.wind_direction_10m }));
}

// ---------- map ----------

const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services";
const ESRI_ATTR = 'Basemap &copy; Esri · Fires: NASA FIRMS · Search &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
// Fire dots: colour = how many fires (same "darker = more" rule as the calendar).
const FIRE_BINS = [[2, "--b3", "1–2"], [9, "--b5", "3–9"], [49, "--b7", "10–49"], [Infinity, "--b8", "50+"]];
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function setupMap() {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  map = L.map("map", { worldCopyJump: true, preferCanvas: true, zoomControl: false }).setView([state.lat, state.lon], 5);
  L.control.zoom({ position: "bottomright" }).addTo(map);

  // Two backgrounds: a calm grey map (fires stand out) and yesterday's real satellite image (smoke is visible).
  const grey = L.layerGroup([
    L.tileLayer(`${ESRI}/Canvas/World_${dark ? "Dark" : "Light"}_Gray_Base/MapServer/tile/{z}/{y}/{x}`, { maxZoom: 16, attribution: ESRI_ATTR }),
    L.tileLayer(`${ESRI}/Canvas/World_${dark ? "Dark" : "Light"}_Gray_Reference/MapServer/tile/{z}/{y}/{x}`, { maxZoom: 16 }),
  ]);
  const satellite = L.layerGroup([
    L.tileLayer(`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_NOAA20_CorrectedReflectance_TrueColor/default/${now.through}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`,
                { maxNativeZoom: 9, maxZoom: 16, attribution: `Satellite: NASA GIBS / VIIRS NOAA-20, ${dayLabel(now.through)} · ${ESRI_ATTR}` }),
    L.tileLayer(`${ESRI}/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}`, { maxZoom: 16 }),
  ]);
  grey.addTo(map);

  const Switch = L.Control.extend({
    onAdd() {
      const div = L.DomUtil.create("div", "map-box basemap");
      div.innerHTML = `<button type="button" aria-pressed="true" data-k="grey">Map</button>`
                    + `<button type="button" aria-pressed="false" data-k="sat">Satellite · ${dayLabel(now.through)}</button>`;
      L.DomEvent.disableClickPropagation(div);
      div.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
        const sat = b.dataset.k === "sat";
        map.removeLayer(sat ? grey : satellite); map.addLayer(sat ? satellite : grey);
        div.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      }));
      return div;
    },
  });
  new Switch({ position: "topright" }).addTo(map);

  const Legend = L.Control.extend({
    onAdd() {
      const div = L.DomUtil.create("div", "map-box map-legend");
      const sw = FIRE_BINS.map(([, v, label]) => `<span class="sw" style="background:${cssVar(v)}"></span>${label}`).join(" ");
      div.innerHTML = `<b>Fires, last 7 days</b> (per ~28 km spot)<br>${sw}<br>`
                    + `<span class="sw" style="background:${cssVar("--b5")};opacity:.3"></span>faded = not burning in the last 2 days<br>`
                    + `<span class="rect"></span><span id="legend-area">Your area</span><br>`
                    + `<span id="legend-path"><span class="line"></span>Smoke path: days to reach Singapore<br></span>`
                    + `<span style="color:var(--ink-2)">Click anywhere to check it</span>`;
      return div;
    },
  });
  new Legend({ position: "bottomleft" }).addTo(map);

  // Fires right now. Each dot sits where the real fires were: the average position
  // of the fires in a ~28 km square (now.points). Older now.json files only have
  // 1-degree cells, so fall back to cell centres for those.
  const lastDay = now.days.length - 1;
  const points = now.points
    || Object.entries(now.cells).map(([c, d]) => { const [la, lo] = c.split(",").map(Number);
                                                    return [la + 0.5, lo + 0.5, d.reduce((a, b) => a + b, 0), lastDay]; });
  // All dots the same size. Colour = how many fires; faded = not seen in the last 2 days.
  const colors = FIRE_BINS.map(([, v]) => cssVar(v));
  const fires = L.layerGroup().addTo(map);
  for (const [la, lo, n, last = lastDay] of [...points].sort((a, b) => a[2] - b[2])) {  // busiest drawn on top
    const recent = last >= lastDay - 1;
    L.circleMarker([la, lo], {
      radius: 4, color: "#ffffff", weight: recent ? 0.8 : 0,
      fillColor: colors[FIRE_BINS.findIndex(([max]) => n <= max)], fillOpacity: recent ? 0.95 : 0.3,
    }).bindTooltip(`${fmt(n)} fire hotspot${n === 1 ? "" : "s"} in the last 7 days · last seen ${dayLabel(now.days[last])}`)
      .addTo(fires);
  }
  overlay = L.featureGroup().addTo(map);
  map.on("click", e => setPlace(e.latlng.lat, e.latlng.lng));
}

function drawMap() {
  overlay.clearLayers();
  document.getElementById("legend-path").style.display = isSingapore() ? "" : "none";
  const box = { color: "#c2410c", weight: 2, dashArray: "6 4", fill: false };
  if (isSingapore()) {
    document.getElementById("legend-area").textContent = "Singapore's smokeshed";
    for (const r of smokeshed.regions) {
      const [s, w, n, e] = r.box_swne;
      L.rectangle([[s, w], [n, e]], box).addTo(overlay)
        .bindTooltip(r.name, { permanent: true, direction: "top", className: "box-label", offset: [0, -4] })
        .openTooltip([n, (w + e) / 2]);
      // The smoke's path to Singapore, labelled with how long it took to arrive.
      L.polyline([[(s + n) / 2, (w + e) / 2], [state.lat, state.lon]], { color: "#c2410c", weight: 3, opacity: 0.8 })
        .addTo(overlay)
        .bindTooltip(`~${r.lag_days} day${r.lag_days === 1 ? "" : "s"}`, { permanent: true, direction: "center", className: "path-label" });
    }
  } else {
    document.getElementById("legend-area").textContent = "Your area";
    const half = (state.size - 1) / 2, la = Math.floor(state.lat), lo = Math.floor(state.lon);
    L.rectangle([[la - half, lo - half], [la + half + 1, lo + half + 1]], box).addTo(overlay);
  }
  L.circleMarker([state.lat, state.lon], { radius: 7, color: "#fff", weight: 2.5, fillColor: "#0b0b0b", fillOpacity: 1 })
    .addTo(overlay).bindTooltip(state.name, { permanent: true, direction: "top", offset: [0, -8], className: "pin-label" });
  map.fitBounds(overlay.getBounds(), { padding: [40, 40], maxZoom: 6 });
}

// ---------- update everything when the place or options change ----------

async function update() {
  history.replaceState(null, "", `#${state.lat.toFixed(3)},${state.lon.toFixed(3)},${state.size}`);
  const cells = areaCells();
  series = await monthlySeries(cells);
  const sg = isSingapore();
  document.getElementById("place").textContent = sg ? "Singapore · smokeshed: Sumatra + Kalimantan"
    : `${state.name} · ~${{ 1: 110, 3: 330, 5: 550 }[state.size]} km area`;
  document.getElementById("size-wrap").style.visibility = sg ? "hidden" : "visible";
  document.getElementById("history").textContent = historySentence(sg ? "in the smokeshed" : "in this area");
  document.getElementById("coming").innerHTML = comingUp();
  document.getElementById("cal-note").innerHTML =
    `Before ${meta.switch_year}, the older MODIS satellite's counts are multiplied by ${areaRatioText(cells)} for this area `
    + `so they match today's VIIRS satellite. <a href="#method-box" id="how-link">See the proof</a>.`;
  writeEvent();
  drawCalendar();
  drawYears();
  drawMap();
  await writeNow(cells);
  // Tell tour.js the page has content, so a tour never points at a "Loading…" page.
  window.smokeshedReady = true;
  document.dispatchEvent(new Event("smokeshed:ready"));
}

function setPlace(lat, lon, name, event = null) {
  state.lat = lat; state.lon = wrapLon(lon);
  state.event = event;  // any other way of picking a place clears the famous-fire box
  state.name = name || `${Math.abs(lat).toFixed(2)}°${lat >= 0 ? "N" : "S"}, ${Math.abs(state.lon).toFixed(2)}°${state.lon >= 0 ? "E" : "W"}`;
  if (isSingapore() && !name) state.name = "Singapore";
  update();
}

document.querySelectorAll(".chips button").forEach(b =>
  b.addEventListener("click", () => setPlace(+b.dataset.lat, +b.dataset.lon, b.dataset.name)));

// Famous-fire buttons, built from EVENTS. They use the ~330 km area the events were checked with.
const famous = document.getElementById("famous");
EVENTS.forEach((ev, k) => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = ev.name;
  b.addEventListener("click", () => {
    state.size = 3;
    document.querySelector('input[name="size"][value="3"]').checked = true;
    setPlace(ev.lat, ev.lon, ev.place, k);
  });
  famous.appendChild(b);
});

document.querySelectorAll('input[name="view"]').forEach(r =>
  r.addEventListener("change", () => { state.view = r.value; drawCalendar(); }));

// "See the proof" opens the method notes, where the harmonization chart is.
document.getElementById("cal-note").addEventListener("click", e => {
  if (e.target.id !== "how-link") return;
  e.preventDefault();
  const box = document.getElementById("method-box");
  box.open = true;
  box.scrollIntoView({ behavior: "smooth", block: "start" });
});

document.querySelectorAll('input[name="size"]').forEach(r =>
  r.addEventListener("change", () => { state.size = +r.value; update(); }));

document.getElementById("search").addEventListener("submit", async e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const ll = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (ll) return setPlace(+ll[1], +ll[2]);
  try {  // free OpenStreetMap geocoder, no key needed
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
    const hit = (await r.json())[0];
    if (hit) setPlace(+hit.lat, +hit.lon, hit.display_name.split(",")[0]);
    else document.getElementById("q").value = `${q}: not found, try another spelling`;
  } catch { document.getElementById("q").value = "Search is offline: click the map instead"; }
});

function fillYearSelects() {
  const opts = Array.from({ length: lastYear - FIRST_YEAR + 1 }, (_, k) => `<option>${FIRST_YEAR + k}</option>`).join("");
  const from = document.getElementById("from"), to = document.getElementById("to");
  from.innerHTML = opts; to.innerHTML = opts;
  from.value = state.from; to.value = state.to;
  const onChange = () => {
    state.from = Math.min(+from.value, +to.value); state.to = Math.max(+from.value, +to.value);
    drawCalendar();
  };
  from.addEventListener("change", onChange); to.addEventListener("change", onChange);
}

function fillMethod() {
  document.getElementById("method").innerHTML = `
    <li><b>Right now:</b> fire hotspots from ${now.source}, ${now.days[0]} to ${now.through}, refreshed daily (last update ${now.updated}). "Normal" is the median for this month in ${FIRST_YEAR}–${lastYear - 1}, scaled to 7 days. Surge = 3× normal or more; above normal = 1.5×.</li>
    <li><b>History:</b> NASA FIRMS hotspots: MODIS Terra (1 km, 2001–2012) and VIIRS S-NPP (375 m, 2013 on), vegetation fires only, low-confidence detections and known gas flares removed. Calendar data to ${meta.data_through}.</li>
    <li><b>Harmonizing:</b> VIIRS sees many more small fires than MODIS (worldwide ${meta.global_ratio}× as many). While both flew (${meta.overlap_years.join("–")}) we measured that ratio separately in each 10° region and converted older MODIS counts into VIIRS-equivalent counts, so every year is comparable. ${meta.ratio_check}
      <img src="docs/harmonization.png" alt="Chart: in 2013–2014, raw MODIS counts sit far below VIIRS; after conversion they line up with VIIRS in both Indonesia and California."
           style="display:block;max-width:100%;margin-top:8px;border:1px solid var(--line);border-radius:6px"></li>
    <li><b>"Usual" and "compared with normal":</b> the median of the same month in ${FIRST_YEAR}–${lastYear - 1}. Fire season = months with at least half the busiest month's usual count. Famous-fire summaries are short background notes; the numbers next to them come from our own data.</li>
    <li><b>Singapore's smokeshed:</b> ${smokeshed.sentence} <a href="docs/feasibility.png">See the chart.</a> Live PM2.5 from NEA via data.gov.sg.</li>
    <li><b>Map:</b> each fire dot is the average position of the fires in a ~28 km square; colour = how many, faded = none in the last 2 days. Satellite image from NASA GIBS (VIIRS NOAA-20 true colour).</li>
    <li><b>Wind:</b> Singapore's current 10 m wind from Open-Meteo (a weather model). The warning checks whether it blows from a fire region toward Singapore.</li>
    <li><b>Use of AI:</b> this site, its data pipeline and its charts were built with the help of Claude (Anthropic's AI assistant). All numbers are computed from the public data. Details: <a href="https://github.com/UndoneLaundry/Smokeshed#use-of-ai-super-intelligence-tools">README</a>.</li>`;
}

async function start() {
  [meta, smokeshed, now] = await Promise.all(
    ["calendar/meta.json", "smokeshed.json", "now.json"].map(f => fetch(DATA + f).then(r => r.json())));
  // The latest *complete* month is the one the history sentence compares.
  const [y, mo, d] = meta.data_through.split("-").map(Number);
  lastFull = idxOf(y, mo - 1) - (d === daysInMonth(y, mo - 1) ? 0 : 1);
  lastYear = y;
  state.to = lastYear;

  // A shared link like #18.790,98.980,3 opens on that place.
  const h = location.hash.slice(1).split(",").map(Number);
  if (h.length === 3 && h.every(Number.isFinite)) {
    state.size = [1, 3, 5].includes(h[2]) ? h[2] : 3;
    document.querySelector(`input[name="size"][value="${state.size}"]`).checked = true;
    state.lat = h[0]; state.lon = h[1];
    state.name = isSingapore() ? "Singapore" : `${h[0].toFixed(2)}, ${h[1].toFixed(2)}`;
  }

  setupMap();
  fillYearSelects();
  fillMethod();
  await update();
}

start().catch(err => {
  document.getElementById("place").textContent = "Could not load the data.";
  document.getElementById("now-sentence").textContent =
    location.protocol === "file:" ? "Open this page through a web server (see README), not by double-clicking the file." : String(err);
});
</script>
<script src="tour.js" defer></script>
</body>
